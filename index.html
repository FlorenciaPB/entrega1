<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis de Tostadora - Entrega 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: #fdf2f8 url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1600&auto=format&fit=crop') center/cover fixed no-repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Marco exterior metálico rosado estilo consola */
    .frame {
      width: 900px;
      max-width: 98vw;
      background: linear-gradient(135deg, 
          #fce7f3 0%, 
          #f472b6 20%, 
          #f43f5e 45%, 
          #fda4af 55%, 
          #e11d48 80%, 
          #881337 100%);
      border: 4px solid #fff1f2;
      border-radius: 40px;
      padding: 20px;
      box-shadow: 0 30px 60px rgba(136, 19, 55, 0.4), inset 0 4px 10px rgba(255, 255, 255, 0.9);
      position: relative;
    }

    /* Pantalla interna morada */
    .board {
      background-color: #2e1065;
      border: 3px solid #fecdd3;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
      color: #fff;
    }

    header {
      text-align: center;
      border-bottom: 2px dashed rgba(255,255,255,0.3);
      padding-bottom: 12px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    p.subtitle {
      color: #fef08a;
      font-size: 0.9rem;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Controles de cambio de imagen */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn {
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 14px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid #fda4af;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: linear-gradient(180deg, #f43f5e 0%, #be185d 100%);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    /* Visor de imágenes */
    .viewer-container {
      position: relative;
      width: 100%;
      height: 420px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #fecdd3;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      cursor: zoom-in;
    }

    .viewer-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.3s ease;
    }

    /* Modal de Zoom */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }

    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      border: 3px solid #fecdd3;
    }
  </style>
</head>
<body>

  <div class="frame">
    <div class="board">

      <header>
        <h1>🍞 Análisis de Tostadora</h1>
        <p class="subtitle">Exploración visual, desglose y vista explotada</p>
      </header>

      <!-- Botones para cambiar la vista -->
      <div class="controls">
        <button class="btn active" onclick="changeImage('input.jpg', this)">Entrada (Input)</button>
        <button class="btn" onclick="changeImage('output.jpg', this)">Salida (Output)</button>
        <button class="btn" onclick="changeImage('vista explotada.jpg', this)">Vista Explotada</button>
      </div>

      <!-- Visor de la imagen -->
      <div class="viewer-container" onclick="openModal()">
        <img id="mainImage" src="input.jpg" alt="Análisis de tostadora">
      </div>

    </div>
  </div>

  <!-- Modal para ver la imagen ampliada -->
  <div class="modal" id="imageModal" onclick="closeModal()">
    <img id="modalImage" src="input.jpg" alt="Imagen ampliada">
  </div>

  <script>
    function changeImage(src, button) {
      const img = document.getElementById('mainImage');
      const modalImg = document.getElementById('modalImage');
      
      img.src = src;
      modalImg.src = src;

      // Actualizar estado de botones
      const buttons = document.querySelectorAll('.controls .btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    function openModal() {
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
  </script>

</body>
</html>
